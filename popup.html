<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Image URL Collector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Image URL Collector</h1>
        <p>URLs directas de las imágenes cargadas en esta pestaña.</p>
      </div>
      <span id="count">0</span>
    </header>

    <div class="actions">
      <button id="scan" class="primary">Escanear página</button>
      <button id="copy" disabled>Copiar todas</button>
    </div>

    <label class="toggle">
      <input id="pinimgOnly" type="checkbox">
      <span>Solo imágenes de pinimg.com</span>
    </label>

    <div id="status">Pulsa “Escanear página”.</div>
    <section id="results"></section>
  </main>
  <script src="popup.js"></script>
</body>
</html>
